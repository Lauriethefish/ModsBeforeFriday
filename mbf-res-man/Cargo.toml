[package]
name = "mbf-res-man"
version = "0.1.0"
edition = "2021"

[dependencies]
mbf-zip = { path = "../mbf-zip" }
ureq = "3.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
qbsdiff = "1.4"
anyhow = "1.0"
const_format = "0.2"
crc = "3.4"
byteorder = "1.5"
log = "0.4"
semver = { version = "1.0", features = ["serde"] }
env_logger = { version = "0.11", default-features = false, features = ["auto-color"], optional = true }
clap = { version = "4.6", features = ["derive"], optional = true }
httpdate = "1.0"

[features]
build-binary = ["clap", "env_logger"]

[lib]
name = "mbf_res_man"
path = "src/lib.rs"

[[bin]]
name = "mbf_res_man"
path = "src/main.rs"
required-features = ["build-binary"]
