[package]
name = "mbf-agent"
version = "0.1.0"
edition = "2021"

[features]
request_timing = []

[dependencies]
mbf-res-man = { path = "../mbf-res-man" }
mbf-zip = { path = "../mbf-zip" }
mbf-axml = { path = "../mbf-axml" }
qbsdiff = "1.4"
byteorder = "1.5"
xml = "1.3"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = { version = "1.0", features = ["serde"] }
ureq = "3.3"
log = "0.4"
jsonschema = { version = "0.48", default-features = false }

[build-dependencies]
ureq = "3.3"
